# ============================================================================
# Unified security scanning — CodeQL + Snyk + Semgrep
# ----------------------------------------------------------------------------
# Runs three independent scanners in parallel and reports every finding to
# the same place: this repository's Security tab -> Code scanning alerts.
# ============================================================================

name: Security scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master
      - name: "Snyk Open Source: scan dependencies"
        continue-on-error: true
        run: snyk test --all-projects --sarif-file-output=snyk-oss.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload Snyk Open Source results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-open-source
      - name: "Snyk Code: static analysis (SAST)"
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload Snyk Code results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  summary:
    name: Post summary comment
    runs-on: ubuntu-latest
    needs: [codeql, snyk, semgrep]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment with consolidated results
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              "CodeQL": "${{ needs.codeql.result }}",
              "Snyk": "${{ needs.snyk.result }}",
              "Semgrep": "${{ needs.semgrep.result }}"
            };
            const icon = (r) => r === "success" ? "✅" : r === "skipped" ? "⏭️" : "❌";
            const rows = Object.entries(results)
              .map(([tool, r]) => `| ${tool} | ${icon(r)} ${r} |`)
              .join("\n");
            const marker = "<!-- security-scan-summary -->";
            const body = [
              marker,
              "### 🛡️ Security scan summary",
              "",
              "| Tool | Status |",
              "|---|---|",
              rows,
              "",
              "Full findings: **Security** tab -> **Code scanning**."
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
