# SonarCloud Automatic Analysis scope.
# Production code and the scripts that run in CI/Netlify are analysed;
# translation-pipeline output, working folders under docs/, generated
# artefacts and vendored files are not.
sonar.sources=src,netlify,tools,scripts
sonar.exclusions=**/node_modules/**,dist/**,public/vendor/**,public/pagefind/**,de-translation/**,zh-translation/**,ru-translation/**,docs/**,src/data/content-fingerprints.json,**/*.md,**/*.txt
# Content data files repeat record shapes by design; keep them out of the
# duplication metric only (they still get bug/vulnerability analysis).
sonar.cpd.exclusions=src/data/**
