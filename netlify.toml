# إعداد نشر «زوروا الأحساء» على Netlify (مشروع Astro).
# مهم: في لوحة Netlify اضبط «Base directory» = astro-site
# حتى يقرأ Netlify هذا الملف ويبني داخل مجلد المشروع.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# نظام حماية المحتوى — الدوال في netlify/functions:
#   copy-log:   تستقبل أحداث النسخ من CopyGuard وتخزّنها في Blobs
#   theft-scan: مسح أسبوعي مجدول (الجدولة معلنة داخل الدالة نفسها:
#               export const config = { schedule: "0 3 * * 1" })
# والـ Edge Function ‏bot-log (netlify/edge-functions) تسجّل عيّنة الزحف —
# مساراتها واستثناءاتها معلنة داخلها أيضاً.
# المفاتيح كلها متغيرات بيئة في لوحة Netlify — لا مفتاح داخل الكود:
#   IP_HASH_SALT, SERPER_API_KEY, RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# تخزين مؤقت طويل للأصول المُبصَّمة وغير المتغيّرة (يحسّن السرعة وLCP)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Leaflet المستضاف ذاتياً — المسار مُصدَّر بالإصدار فالتخزين الدائم آمن
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# رؤوس أمان أساسية
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# الصور والفيديو (غير مُبصَّمة): تخزين شهراً — يوازن السرعة مع إمكانية استبدال الملف بنفس الاسم
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
