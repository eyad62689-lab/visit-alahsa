# إعداد نشر «زوروا الأحساء» على Netlify (مشروع Astro).
# هذا المستودع هو جذر المشروع: «Base directory» في لوحة Netlify يبقى فارغاً.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# نظام حماية المحتوى — الدوال في netlify/functions:
#   copy-log:   تستقبل أحداث النسخ من CopyGuard وتخزّنها في Blobs
#   advisor:    المستشار الذكي — يبثّ جواب Claude من بطاقة معرفة الموقع (netlify/functions/advisor/،
#               البطاقة kb.generated.json تُولَّد في postbuild وتُحزم هنا؛ المفاتيح ANTHROPIC_API_KEY وADVISOR_*)
#   weather:    طقس الهفوف لشارة رأس الرئيسية ومؤثّر فصلها الأول (GET /api/weather، مخزّن على الشبكة 30 دقيقة،
#               المصدر Open-Meteo بلا مفتاح)
#   theft-scan: مسح أسبوعي مجدول (الجدولة معلنة داخل الدالة نفسها:
#               export const config = { schedule: "0 3 * * 1" })
# والـ Edge Function ‏bot-log (netlify/edge-functions) تسجّل عيّنة الزحف —
# مساراتها واستثناءاتها معلنة داخلها أيضاً.
# المفاتيح كلها متغيرات بيئة في لوحة Netlify — لا مفتاح داخل الكود:
#   IP_HASH_SALT, SERPER_API_KEY, RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM,
#   ANTHROPIC_API_KEY, ADVISOR_MODEL, ADVISOR_EFFORT, ADVISOR_MONTHLY_CAP_USD, ADVISOR_DAILY_PER_IP, ADVISOR_DISABLED
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# إشعار IndexNow بعد نجاح النشر (Bing وYandex وSeznam وNaver — وهي بوابة
# ChatGPT Search وCopilot). يدفع الروابط التي تغيّرت منذ آخر نشر ناجح فقط،
# مستنداً إلى lastmod في sitemap. لا يُفشل النشر مهما كانت النتيجة.
# التعطيل: احذف هذا القسم، أو اضبط INDEXNOW_DRY_RUN=1 في متغيرات البيئة.
# البديل عن GitHub Action المقترح في الدراسة — انظر submit.mjs للسبب.
[[plugins]]
  package = "./netlify/plugins/indexnow"

# تحويل دائم على مستوى المضيف: النطاق الفرعي الافتراضي على Netlify كان يُخدم بـ200
# و«index, follow» فتزاحم نسخته النطاقَ الرسمي في نتائج محركات الإجابة. المطابقة على
# المضيف حرفياً، فلا تمسّ معاينات النشر (deploy-preview-N--visit-ahsa.netlify.app).
# تُبقي :splat المسار والاستعلام كما هما، وforce يقدّمها على الملفات الموجودة.
[[redirects]]
  from = "https://visit-ahsa.netlify.app/*"
  to = "https://visit-alahsa.com/:splat"
  status = 301
  force = true

# تحويل دائم: صفحة السياسات الإنجليزية مسارها /en/legal/.
[[redirects]]
  from = "/en/policies/"
  to = "/en/legal/"
  status = 301

[[redirects]]
  from = "/en/policies"
  to = "/en/legal/"
  status = 301

# رؤوس HTTP (التخزين المؤقت ورؤوس الأمان وCSP) في public/_headers وحده — مصدر واحد
# يُنسخ إلى dist/_headers عند البناء. لا تُضف [[headers]] هنا: القاعدة المكرّرة في
# الملفين تسمح بتعديل أحدهما دون الآخر بلا أي إنذار (يحرسه C78 في check-consistency).
