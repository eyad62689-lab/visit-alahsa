# إعداد نشر «زوروا الأحساء» على Netlify (مشروع Astro).
# هذا المستودع هو جذر المشروع: «Base directory» في لوحة Netlify يبقى فارغاً.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# نظام حماية المحتوى — الدوال في netlify/functions:
#   copy-log:   تستقبل أحداث النسخ من CopyGuard وتخزّنها في Blobs
#   theft-scan: مسح أسبوعي مجدول (الجدولة معلنة داخل الدالة نفسها:
#               export const config = { schedule: "0 3 * * 1" })
# والـ Edge Function ‏bot-log (netlify/edge-functions) تسجّل عيّنة الزحف —
# مساراتها واستثناءاتها معلنة داخلها أيضاً.
# المفاتيح كلها متغيرات بيئة في لوحة Netlify — لا مفتاح داخل الكود:
#   IP_HASH_SALT, SERPER_API_KEY, RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# إشعار IndexNow بعد نجاح النشر (Bing وYandex وSeznam وNaver — وهي بوابة
# ChatGPT Search وCopilot). يدفع الروابط التي تغيّرت منذ آخر نشر ناجح فقط،
# مستنداً إلى lastmod في sitemap. لا يُفشل النشر مهما كانت النتيجة.
# التعطيل: احذف هذا القسم، أو اضبط INDEXNOW_DRY_RUN=1 في متغيرات البيئة.
# البديل عن GitHub Action المقترح في الدراسة — انظر submit.mjs للسبب.
[[plugins]]
  package = "./netlify/plugins/indexnow"

# تخزين مؤقت طويل للأصول المُبصَّمة وغير المتغيّرة (يحسّن السرعة وLCP)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Leaflet المستضاف ذاتياً — المسار مُصدَّر بالإصدار فالتخزين الدائم آمن
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# رؤوس أمان أساسية
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # HTTPS إلزامي سنةً كاملة (الموقع لا يُخدم إلا عبر Netlify HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # لا يستخدم الموقع الكاميرا ولا الميكروفون ولا الموقع الجغرافي — نعلن ذلك صراحةً
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP بوضع التقرير فقط (لا يحجب شيئاً): يكشف في console أي مصدر غير مدرج قبل
    # الانتقال إلى Content-Security-Policy الإلزامي. unsafe-inline لازم للسكربتات
    # الداخلية (GA، الخرائط، رحلتي) إلى أن تُنقل إلى ملفات أو nonces.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://tiles.openfreemap.org https://s3.amazonaws.com https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://tiles.openfreemap.org https://s3.amazonaws.com https://*.basemaps.cartocdn.com; font-src 'self'; media-src 'self'; worker-src 'self' blob:; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# الصور والفيديو (غير مُبصَّمة): تخزين شهراً — يوازن السرعة مع إمكانية استبدال الملف بنفس الاسم
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
